[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thonk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pyyaml>=6", "openai>=1.40", "anthropic>=0.40"]

[project.optional-dependencies]
laya = ["laya"]

[project.scripts]
thonk = "thonk.cli:app"

[tool.setuptools]
packages = ["thonk", "thonk.providers"]
