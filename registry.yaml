router:
  checkpoint: convaiinnovations/laya
  subfolder: null          # ex: "multilingual" for non-English
  min_confidence: 0.60     # if top tier prob is below this, bump up one tier

models:
  # easy
  - name: qwen
    tier: easy
    provider: openai_compat
    base_url: https://maas.qwencloudapi.com/compatible-mode/v1
    model: Qwen3.7-Max           
    api_key_env: DASHSCOPE_API_KEY

  - name: grok
    tier: easy
    provider: openai_compat
    base_url: https://api.x.ai/v1       
    model: grok-4.3-latest
    api_key_env: GROK_API_KEY

  # medium
  - name: gemini
    tier: medium
    provider: gemini   
    base_url: https://generativelanguage.googleapis.com/v1beta/interactions
    model: gemini-3.8-flash    
    api_key_env: GEMINI_API_KEY

  - name: deepseek
    tier: medium
    provider: openai_compat
    base_url: https://api.deepseek.com
    model: deepseek-flash           
    api_key_env: DEEPSEEK_API_KEY

  # hard
  - name: claude
    tier: hard
    provider: anthropic
    base_url: https://api.anthropic.com
    model: claude-haiku-4-5-20251001  # cheapest Claude rn for testing purposes
    api_key_env: ANTHROPIC_API_KEY

  - name: chatgpt
    tier: hard
    provider: openai_compat
    base_url: https://api.openai.com/v1
    model: gpt-6-luna           # OpenAI's cheapest for testing purposes
    api_key_env: OPENAI_API_KEY
    token_param: max_completion_tokens
